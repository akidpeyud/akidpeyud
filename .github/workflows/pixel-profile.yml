name: Update Pixel Profile

on:
  schedule:
    - cron: "0 * * * *" # otomatis tiap 1 jam
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths:
      - "scripts/generate.py"
      - ".github/workflows/pixel-profile.yml"

permissions:
  contents: write

concurrency:
  group: pixel-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pixel assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # dipakai kalau repo terakhir yang di-push sudah lama / privat
          QUEST_FALLBACK: "SIMERAH KOJA"
          QUEST_MAX_AGE_HOURS: "1"
        run: python scripts/generate.py

      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update pixel profile assets and status"
            git push
          fi
