name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # otomatis tiap 12 jam
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=4DA3E0&color_dots=#0D1B2E,#1B365D,#005A9C,#2F8FD8,#7FC4FF&color_dot_border=#0D1B2E

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
